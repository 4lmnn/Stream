worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 2048; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  sendfile on;
  client_max_body_size 1m;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  resolver 127.0.0.11 valid=5s ipv6=off;

  server {
    listen 80;
    root /srv/aula;
    index index.html;
    set $media_upstream mediamtx:8889;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;

    # Solo comprueba Nginx; no representa el estado del video.
    location = /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }

    # 404 intencional hasta que escribas y compiles tu index.html.
    location = / { try_files /index.html =404; }
    location / { try_files $uri =404; }
    location ~ /\. { return 404; }

    # Señalización WHIP/WHEP; el video WebRTC viaja por UDP directamente a MediaMTX.
    location /media/ {
      # Conserva el puerto externo de Docker al resolver Location en el cliente.
      # Sin esto, Nginx puede generar http://localhost/... (puerto 80, no 8090).
      absolute_redirect off;
      rewrite ^/media/(.*)$ /$1 break;
      proxy_pass http://$media_upstream;
      proxy_set_header Host $http_host;
      proxy_redirect / /media/;
      proxy_buffering off;
      proxy_read_timeout 30s;
    }
  }
}
